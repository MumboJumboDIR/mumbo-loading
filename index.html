<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MUMBO'S Z-CITY DARK RP</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
    }
    .wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      box-sizing: border-box;
    }
    img {
      max-width: min(96vw, 1280px);
      max-height: min(78vh, 720px);
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      border: 0;
      box-shadow: 0 0 40px rgba(180, 0, 0, 0.35);
    }
    h1 {
      margin: 0;
      color: #e8e8e8;
      font-size: clamp(18px, 2.4vw, 28px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-align: center;
      text-shadow: 0 0 12px rgba(255, 40, 40, 0.55);
    }
    .status {
      color: #9a9a9a;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="mumbos-zcity-darkrp-intro.jpg" alt="MUMBO'S Z-CITY DARK RP" />
    <h1>MUMBO'S Z-CITY DARK RP</h1>
    <div class="status" id="status">Connecting&hellip;</div>
  </div>
  <script>
    // Optional Garry's Mod loading-screen hooks (ignored in a normal browser)
    function GameDetails(servername, serverurl, mapname) { try { if (mapname) document.getElementById("status").textContent = "Loading " + mapname + "\u2026"; } catch (e) {} }
    function SetStatusChanged(status) { try { if (status) document.getElementById("status").textContent = status; } catch (e) {} }
  </script>
</body>
</html>
