<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MUMBO'S Z-CITY DARK RP</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
    }
    .bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      background: #000 url("mumbos-zcity-darkrp-intro.jpg") center center / cover no-repeat;
    }
    .bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 18px 24px 22px;
      text-align: center;
      background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
    }
    h1 {
      margin: 0 0 6px;
      color: #e8e8e8;
      font-size: 28px;
      font-size: clamp(18px, 2.4vw, 32px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-shadow: 0 0 12px rgba(255, 40, 40, 0.65), 0 2px 4px #000;
    }
    .status {
      color: #cfcfcf;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 2px 4px #000;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="bar">
    <h1>MUMBO'S Z-CITY DARK RP</h1>
    <div class="status" id="status">Connecting&hellip;</div>
  </div>
  <script>
    // Optional Garry's Mod loading-screen hooks (ignored in a normal browser)
    function GameDetails(servername, serverurl, mapname) { try { if (mapname) document.getElementById("status").textContent = "Loading " + mapname + "\u2026"; } catch (e) {} }
    function SetStatusChanged(status) { try { if (status) document.getElementById("status").textContent = status; } catch (e) {} }
  </script>
</body>
</html>
